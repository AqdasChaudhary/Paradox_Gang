* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper) var(--paws); color: var(--ink); font: 400 1.0625rem/1.6 var(--body);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 22rem; display: grid; gap: 1rem; }
.label { font: 500 0.75rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(2.4rem, 12vw, 3.4rem)/0.9 var(--display); letter-spacing: -0.04em; text-transform: uppercase; }
h1 span { display: block; color: var(--coral); }
p { margin: 0; color: var(--muted); }
input { font: inherit; padding: 0.75rem 0.9rem; border: 1.5px solid var(--line); border-radius: 0.5rem; background: var(--surface); color: var(--ink); }
input:focus { outline: none; border-color: var(--cobalt); }
.remember { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; color: var(--muted); }
.remember input { padding: 0; }
button { font: 600 1rem/1 var(--body); padding: 0.85rem; border: 0; border-radius: 0.5rem; background: var(--cobalt); color: #fff; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
button[disabled] { opacity: 0.6; cursor: progress; }
.gate-cat { width: 4.5rem; height: 4.5rem; color: var(--coral); }
.gate-cat .eye { fill: var(--paper); }
.err { color: var(--coral); min-height: 1.6em; font-size: 0.95rem; }
</style>

const KEY_STORE = "pardox-member";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

const normalize = n => n.trim().split(/\s+/).join(" ").toLowerCase();

// Returns the site HTML and the member's display name, or throws if the name isn't on the list.
async function unlock(name, pass = "") {
  const secret = normalize(name) + (pass ? "\0" + pass.trim().toLowerCase() : "");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), "PBKDF2", false, ["deriveKey"]);
  const kek = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  let member = null;
  for (const lock of LOCKS) {
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(lock.iv) }, kek, bytes(lock.ct));
      member = JSON.parse(new TextDecoder().decode(plain)); break;
    } catch {}
  }
  if (!member) throw new Error("not a member");
  const siteKey = await crypto.subtle.importKey("raw", bytes(member.key), "AES-GCM", false, ["decrypt"]);
  const site = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, siteKey, bytes(DATA));
  return { html: new TextDecoder().decode(site), name: member.name };
}
function show({ html, name }) { document.open(); document.write(html.replace('"%%MEMBER%%"', JSON.stringify(name))); document.close(); }

const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value, pass = document.getElementById("pass").value;
  go.disabled = true; err.textContent = "";
  try {
    const result = await unlock(pw, pass);
    try { document.getElementById("remember").checked ? localStorage.setItem(KEY_STORE, JSON.stringify({ name: pw, pass })) : localStorage.removeItem(KEY_STORE); } catch {}
    show(result);
  } catch {
    err.textContent = "Wrong name or password. Check them and try again.";
    go.disabled = false;
  }
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch {}
  if (!saved) return;
  let login;
  try { login = JSON.parse(saved); } catch { login = { name: saved }; }
  if (!login || typeof login !== "object") login = { name: saved };
  try { show(await unlock(login.name, login.pass)); } catch { try { localStorage.removeItem(KEY_STORE); } catch {} }
})();
</script>
