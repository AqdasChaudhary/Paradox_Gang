<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pardox Gang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Figtree:wght@400;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root {
  --paper: #ECEEF6; --surface: #FFFFFF; --ink: #16172C; --muted: #5C5F7A;
  --line: #D3D6E6; --cobalt: #3B39E8; --coral: #F2603F;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #0F1020; --surface: #181A30; --ink: #E9EAF6; --muted: #9EA1BE;
    --line: #2A2D4A; --cobalt: #8C8AFF; --coral: #FF8768; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1.0625rem/1.6 var(--body);
  display: grid; place-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
form { width: 100%; max-width: 22rem; display: grid; gap: 1rem; }
.label { font: 500 0.75rem/1 var(--mono); text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
h1 { margin: 0; font: 800 clamp(2.4rem, 12vw, 3.4rem)/0.9 var(--display); letter-spacing: -0.04em; text-transform: uppercase; }
h1 span { display: block; color: var(--coral); }
p { margin: 0; color: var(--muted); }
input { font: inherit; padding: 0.75rem 0.9rem; border: 1.5px solid var(--line); border-radius: 0.5rem; background: var(--surface); color: var(--ink); }
input:focus { outline: none; border-color: var(--cobalt); }
.remember { display: flex; gap: 0.5rem; align-items: center; font-size: 0.9rem; color: var(--muted); }
.remember input { padding: 0; }
button { font: 600 1rem/1 var(--body); padding: 0.85rem; border: 0; border-radius: 0.5rem; background: var(--cobalt); color: #fff; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
button[disabled] { opacity: 0.6; cursor: progress; }
.err { color: var(--coral); min-height: 1.6em; font-size: 0.95rem; }
</style>
</head>
<body>
<form id="gate" autocomplete="on">
  <span class="label">Members only</span>
  <h1>Pardox<span>Gang</span></h1>
  <p>Enter the gang password to come in.</p>
  <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus>
  <label class="remember"><input id="remember" type="checkbox" checked> Remember me on this device</label>
  <button id="go" type="submit">Enter</button>
  <div class="err" id="err" role="alert"></div>
</form>

const KEY_STORE = "pardox-pw";
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}
function show(html) { document.open(); document.write(html); document.close(); }

const form = document.getElementById("gate"), err = document.getElementById("err"), go = document.getElementById("go");
form.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  go.disabled = true; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { document.getElementById("remember").checked ? localStorage.setItem(KEY_STORE, pw) : localStorage.removeItem(KEY_STORE); } catch {}
    show(html);
  } catch {
    err.textContent = "That password didn't work. Check with the gang and try again.";
    go.disabled = false;
  }
});

(async () => {
  let saved = null;
  try { saved = localStorage.getItem(KEY_STORE); } catch {}
  if (!saved) return;
  try { show(await unlock(saved)); } catch { try { localStorage.removeItem(KEY_STORE); } catch {} }
})();
</script>
